<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5 temos algumas tags interessantes, passe o mouse em cima da tag que sabera do que cada uma delas serve:</p>
    <ul>
        <li><abbr title="usa a tag &lt;p&gt;">Paragrafos</abbr></li>
        <li><abbr title="usa a tag &lt;h1&gt;">Titulos</abbr></li>
        <li><abbr title="usa a tag &lt;img&gt;">Imagens</abbr></li>
        <li><abbr title="usa a tag &lt;abbr&gt;">Abreviações</abbr></li>
        <li><abbr title="usa a tag &lt;code&gt;">Codigo-fonte</abbr></li>
        <li><abbr title="usa a tag &lt;ol&gt; e &lt;li&gt;">Listas numeradas</abbr></li>
        <li><abbr title="usa a tag &lt;ul&gt; e &lt;li&gt;">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
