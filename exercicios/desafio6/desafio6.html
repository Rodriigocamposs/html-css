<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        thead > tr > th{
            background-color: gray;
        }
        th.enfase{
            background-color: gray;
        }
        td.enfase{
            background-color: gray;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Area</th>
                <th colspan="2" rowspan="2">Disciplina</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Media</th>
            </tr>
            <tr>
                <th>nota1</th>
                <th>nota2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td colspan="2">Matematica</td>
                <td>8,0</td>
                <td>7,0</td>
                <td>7,5</td>
            </tr>
            <tr>
                <td colspan="2">Fisica</td>
                <td>6,5</td>
                <td>8,0</td>
                <td>7,25</td>
            </tr>
            <tr>
                <td colspan="2">Quimica</td>
                <td>9,0</td>
                <td>8,5</td>
                <td>8,75</td>
            </tr>
            <tr>
                <td colspan="2">Biologia</td>
                <td>7,0</td>
                <td>6,0</td>
                <td>6,5</td>
            </tr>
            <tr>
                <th colspan="5" class="enfase">Media de Exatas</th>
                <td class="enfase">7,5</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td colspan="2">Historia</td>
                <td>8,5</td>
                <td>9,0</td>
                <td>8,75</td>
            </tr>
            <tr>
                <td colspan="2">Geografia</td>
                <td>7,5</td>
                <td>8,5</td>
                <td>8,0</td>
            </tr>
            <tr>
                <th colspan="5" class="enfase">Media de Humanas</th>
                <td class="enfase">8,37</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
