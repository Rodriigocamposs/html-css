<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        a{
            color: aquamarine;
            text-decoration: none;
        }
        a:visited{
            color: rgb(69, 179, 179);
        }
        a:hover{
            text-decoration: underline;
        }
        a::after{
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a href="https://github.com/Rodriigocamposs?tab=repositories" target="_blank">repositorio github</a></li>
        <li><a href="https://www.youtube.com/@CortesdejogosCR" target="_blank">canal youtube</a></li>
    </ul>
</body>
</html>
