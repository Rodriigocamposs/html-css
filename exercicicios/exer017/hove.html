<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
    <style>
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: aliceblue;
            background-color: black;
            width: 300px;
        }
        div:hover{
            color: black;
        }
    </style>
</head>
<body>
    <h1>exemplo</h1>
    <p>passe o mouse no texto abaixo</p>
    <div>
        passe o mouse aqui
        <p>loucura loucura loucura</p>

    </div>
</body>
</html>
